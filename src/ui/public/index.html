<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinHunter</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">

  <script type="module" src="/app.js"></script>
